name: Morok Mobile Android

on:
  push:
    paths:
      - "MOROK/Mobile/**"
      - ".github/workflows/morok-mobile.yml"
  pull_request:
    paths:
      - "MOROK/Mobile/**"
      - ".github/workflows/morok-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOROK/Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile debug
        run: gradle --no-daemon assembleDebug

      - name: Unit tests
        run: gradle --no-daemon test

      - name: Lint release
        run: gradle --no-daemon lintRelease

      - name: Compile release
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: morok-mobile-debug
          path: MOROK/Mobile/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: morok-mobile-release
          path: MOROK/Mobile/app/build/outputs/apk/release/*.apk
