name: Morok Mobile Android Debug

on:
  push:
    paths: ["MOROK/Mobile/**", ".github/workflows/morok-mobile.yml"]
  pull_request:
    paths: ["MOROK/Mobile/**", ".github/workflows/morok-mobile.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MOROK/Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug
        run: gradle --no-daemon -PMOROK_BUILD_SHA="${{ github.sha }}" assembleDebug
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Lint release
        run: gradle --no-daemon lintRelease
      - name: Create ephemeral CI signing key
        working-directory: MOROK/Mobile
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/morok-ci.jks" -storepass "morok-ci-password" -keypass "morok-ci-password" -alias "morok-ci" -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Morok CI, OU=Build, O=Korczak Technology, L=CI, ST=CI, C=BR"
      - name: Compile signed release
        env:
          MOROK_KEYSTORE_FILE: ${{ runner.temp }}/morok-ci.jks
          MOROK_KEYSTORE_PASSWORD: morok-ci-password
          MOROK_KEY_ALIAS: morok-ci
          MOROK_KEY_PASSWORD: morok-ci-password
        run: gradle --no-daemon -PMOROK_BUILD_SHA="${{ github.sha }}" assembleRelease
      - name: Verify APK outputs
        run: |
          find app/build/outputs/apk -type f -name "*.apk" -print
          test "$(find app/build/outputs/apk -type f -name "*.apk" | wc -l)" -ge 2
          while IFS= read -r apk; do
            test -s "$apk"
          done < <(find app/build/outputs/apk -type f -name "*.apk")
      - name: Prepare debug updater artifact
        run: |
          cp app/build/outputs/apk/debug/*.apk app/build/outputs/apk/debug/morok-mobile-debug.apk
          echo "${{ github.sha }}" > app/build/outputs/apk/debug/morok-commit.txt
          echo "${{ github.run_id }}" > app/build/outputs/apk/debug/morok-run.txt
          echo "${{ github.event.head_commit.id || github.sha }}" > app/build/outputs/apk/debug/morok-source.txt
          grep "^versionName" app/build/intermediates/packaged_manifests/debug/processDebugManifest/AndroidManifest.xml >/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: morok-mobile-debug
          path: |
            MOROK/Mobile/app/build/outputs/apk/debug/morok-mobile-debug.apk
            MOROK/Mobile/app/build/outputs/apk/debug/morok-commit.txt
            MOROK/Mobile/app/build/outputs/apk/debug/morok-run.txt
            MOROK/Mobile/app/build/outputs/apk/debug/morok-source.txt
      - name: Prepare public debug updater
        run: |
          rm -rf /tmp/morok-pages
          mkdir -p /tmp/morok-pages
          cp app/build/outputs/apk/debug/*.apk /tmp/morok-pages/morok-mobile-debug.apk
          sha256sum /tmp/morok-pages/morok-mobile-debug.apk | awk '{print $1}' > /tmp/morok-pages/morok-mobile-debug.sha256
          SHA=$(cat /tmp/morok-pages/morok-mobile-debug.sha256)
          printf '{"version":"debug","channel":"debug","sha":"%s","apkUrl":"https://korczaktechnology-tech.github.io/JARVIS/morok-mobile-debug.apk"}
' "$SHA" > /tmp/morok-pages/morok-update.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/morok-pages
      - id: deployment
        uses: actions/deploy-pages@v4
