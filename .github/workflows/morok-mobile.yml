name: Morok Mobile Debug Release

on:
  push:
    branches: [main]
    paths:
      - "MOROK/Mobile/**"
      - ".github/workflows/morok-mobile-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-debug:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: MOROK/Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key
        env:
          MOROK_RELEASE_KEYSTORE_BASE64: ${{ secrets.MOROK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$MOROK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morok-release.keystore"

      - name: Build debug APK
        env:
          MOROK_KEYSTORE_FILE: ${{ runner.temp }}/morok-release.keystore
          MOROK_KEYSTORE_PASSWORD: ${{ secrets.MOROK_RELEASE_KEYSTORE_PASSWORD }}
          MOROK_KEY_ALIAS: ${{ secrets.MOROK_RELEASE_KEY_ALIAS }}
          MOROK_KEY_PASSWORD: ${{ secrets.MOROK_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon -PMOROK_BUILD_SHA="${{ github.sha }}" assembleDebug

      - name: Prepare debug assets
        run: |
          mkdir -p "${{ runner.temp }}/morok-release"
          cp app/build/outputs/apk/debug/*.apk "${{ runner.temp }}/morok-release/morok-debug.apk"
          sha256sum "${{ runner.temp }}/morok-release/morok-debug.apk" | awk '{print $1}' > "${{ runner.temp }}/morok-release/morok-debug.sha256"
          echo "${{ github.sha }}" > "${{ runner.temp }}/morok-release/build-sha.txt"

      - name: Replace debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete morok-debug --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.0.1 --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.0.2 --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.0.3 --cleanup-tag --yes 2>/dev/null || true
          gh release create morok-debug \
            --target "${{ github.sha }}" \
            --title "Morok Debug" \
            --prerelease \
            --notes "Morok Mobile debug build. Commit: ${{ github.sha }}" \
            "${{ runner.temp }}/morok-release/morok-debug.apk#morok-debug.apk" \
            "${{ runner.temp }}/morok-release/morok-debug.sha256#morok-debug.sha256" \
            "${{ runner.temp }}/morok-release/build-sha.txt#build-sha.txt"
