name: Morok Mobile Debug Release

on:
  push:
    branches: [main]
    paths:
      - "MOROK/Mobile/**"
      - ".github/workflows/morok-mobile-release.yml"
      - ".github/workflows/morok-mobile.yml"
  workflow_dispatch:

concurrency:
  group: morok-mobile-debug
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release-debug:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: MOROK/Mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            MOROK/Mobile
            .github/workflows/morok-mobile.yml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare persistent signing key
        env:
          MOROK_RELEASE_KEYSTORE_BASE64: ${{ secrets.MOROK_RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$MOROK_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/morok-debug.keystore"

      - name: Build debug APK
        env:
          MOROK_KEYSTORE_FILE: ${{ runner.temp }}/morok-debug.keystore
          MOROK_KEYSTORE_PASSWORD: ${{ secrets.MOROK_RELEASE_KEYSTORE_PASSWORD }}
          MOROK_KEY_ALIAS: ${{ secrets.MOROK_RELEASE_KEY_ALIAS }}
          MOROK_KEY_PASSWORD: ${{ secrets.MOROK_RELEASE_KEY_PASSWORD }}
        run: gradle --no-daemon -PMOROK_BUILD_SHA="${{ github.sha }}" -PMOROK_VERSION_CODE="${{ github.run_number }}" -PMOROK_VERSION_NAME="0.0.${{ github.run_number }}-debug" assembleDebug

      - name: Validate debug APK before publishing
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          test -n "$AAPT2"
          "$AAPT2" dump badging "$APK" | tee "$RUNNER_TEMP/morok-badging.txt"
          grep -q "package: name='com.korczak.morok'" "$RUNNER_TEMP/morok-badging.txt"
          grep -q "application-label:'Morok'" "$RUNNER_TEMP/morok-badging.txt"
          grep -q -- "-debug" "$RUNNER_TEMP/morok-badging.txt"
      - name: Prepare debug assets
        run: |
          mkdir -p "${{ runner.temp }}/morok-debug"
          cp app/build/outputs/apk/debug/*.apk "${{ runner.temp }}/morok-debug/morok-debug.apk"
          sha256sum "${{ runner.temp }}/morok-debug/morok-debug.apk" | awk '{print $1}' > "${{ runner.temp }}/morok-debug/morok-debug.sha256"
          echo "${{ github.sha }}" > "${{ runner.temp }}/morok-debug/build-sha.txt"

      - name: Replace debug release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete morok-debug --cleanup-tag --yes 2>/dev/null || true
          gh release delete morok-release --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.0.1 --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.0.2 --cleanup-tag --yes 2>/dev/null || true
          gh release delete v0.0.3 --cleanup-tag --yes 2>/dev/null || true
          gh release create morok-debug \
            --target "${{ github.sha }}" \
            --title "Morok Debug App" \
            --prerelease \
            --notes "Morok Mobile debug build. Commit: ${{ github.sha }}" \
            "${{ runner.temp }}/morok-debug/morok-debug.apk#morok-debug.apk" \
            "${{ runner.temp }}/morok-debug/morok-debug.sha256#morok-debug.sha256" \
            "${{ runner.temp }}/morok-debug/build-sha.txt#build-sha.txt"
