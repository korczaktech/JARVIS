name: Morok Mobile Release

on:
  push:
    branches: [main]
    paths:
      - "MOROK/Mobile/**"
      - ".github/workflows/morok-mobile-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: morok-mobile-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Calculate next semantic version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName' || true)"
          latest="${latest#v}"
          if [ -z "$latest" ]; then
            major=0; minor=0; patch=0
          else
            IFS=. read -r major minor patch <<< "$latest"
            major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}
          fi
          patch=$((patch + 1))
          version="${major}.${minor}.${patch}"
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Validate persistent release signing credentials
        env:
          KEYSTORE_B64: ${{ secrets.MOROK_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOROK_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOROK_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOROK_RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Configure all four MOROK_RELEASE_* repository secrets before publishing releases."
            exit 1
          fi

      - name: Decode and validate release keystore
        env:
          KEYSTORE_B64: ${{ secrets.MOROK_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOROK_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOROK_RELEASE_KEY_ALIAS }}
        run: |
          normalized="$(printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | tr '_-' '/+')"
          if ! printf '%s' "$normalized" | base64 --decode > "$RUNNER_TEMP/morok-release.jks"; then
            echo "::error::MOROK_RELEASE_KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          test -s "$RUNNER_TEMP/morok-release.jks"
          if ! keytool -list -keystore "$RUNNER_TEMP/morok-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::The decoded release keystore is invalid, or its password/alias does not match the configured secrets."
            exit 1
          fi

      - name: Build signed release
        working-directory: MOROK/Mobile
        env:
          MOROK_KEYSTORE_FILE: ${{ runner.temp }}/morok-release.jks
          MOROK_KEYSTORE_PASSWORD: ${{ secrets.MOROK_RELEASE_KEYSTORE_PASSWORD }}
          MOROK_KEY_ALIAS: ${{ secrets.MOROK_RELEASE_KEY_ALIAS }}
          MOROK_KEY_PASSWORD: ${{ secrets.MOROK_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -PMOROK_VERSION_NAME="${{ steps.version.outputs.version }}" -PMOROK_VERSION_CODE="${{ steps.version.outputs.code }}"

      - name: Prepare release assets
        working-directory: MOROK/Mobile
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/morok-mobile.apk"
          sha256sum "$RUNNER_TEMP/morok-mobile.apk" | awk '{print $1}' > "$RUNNER_TEMP/morok-mobile.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}"             "$RUNNER_TEMP/morok-mobile.apk#morok-mobile.apk"             "$RUNNER_TEMP/morok-mobile.sha256#morok-mobile.sha256"             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "Morok Mobile v${{ steps.version.outputs.version }}"             --generate-notes

      - name: Cleanup signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/morok-release.jks"
