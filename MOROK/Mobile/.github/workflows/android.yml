name: Android
on:
  push:
    paths: ["MOROK/Mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["MOROK/Mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: MOROK/Mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Unit tests
        run: gradle --no-daemon test
      - name: Lint release
        run: gradle --no-daemon lintRelease
      - name: Build release APK
        run: gradle --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: morok-mobile-debug
          path: MOROK/Mobile/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: morok-mobile-release
          path: MOROK/Mobile/app/build/outputs/apk/release/*.apk
